<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <meta name="description" content="ARACHNID — The Web Guardian. A cinematic, AI-powered interactive experience. 3D city, dynamic weather, scroll storytelling, AI story/suit/cover forge, multiverse explorer, gamified secrets." />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="ARACHNID — The Web Guardian AI Experience" />
    <meta property="og:description" content="A flagship, Spider-inspired interactive web experience: cinematic 3D hero, scroll-storytelling, layered AI features, gamification and hidden secrets." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&family=Space+Grotesk:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <title>ARACHNID — The Web Guardian</title>
    <style>
      /* Inline splash so the first paint is branded, not a white flash. */
      html, body { margin: 0; background: #050508; color: #f5f5f7; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(1200px 700px at 50% 40%, #160a12 0%, #050508 60%); }
      #boot .mark { font-family: 'Unbounded', sans-serif; font-weight: 800; letter-spacing: 0.35em; font-size: clamp(18px, 4vw, 30px); color: #ff3b3b; text-shadow: 0 0 30px rgba(255, 59, 59, 0.55); animation: bootPulse 1.6s ease-in-out infinite; }
      #boot .bar { width: min(280px, 60vw); height: 2px; background: rgba(255,255,255,0.08); overflow: hidden; border-radius: 2px; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, #ff3b3b, #2f6bff, transparent); animation: bootSlide 1.1s linear infinite; }
      @keyframes bootPulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; text-shadow: 0 0 60px rgba(255, 59, 59, 0.9); } }
      @keyframes bootSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="mark">ARACHNID</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
